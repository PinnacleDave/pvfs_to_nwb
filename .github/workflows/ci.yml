name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build wheel

      # pypvfs ships pre-built wheels only for linux_x86_64 and win_amd64; the
      # CI matrix is therefore intentionally limited to those targets.  Native
      # builds from sdist would require CMake + a C++17 toolchain which is
      # out of scope for this workflow.
      - name: Install pvfs-to-nwb with test extras
        run: python -m pip install ".[test]"

      - name: Run tests
        run: pytest -v

  # Smoke-build the wheel/sdist so packaging metadata stays valid.
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine
      - name: Build
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
